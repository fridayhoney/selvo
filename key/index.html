<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your key · Selvo</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f3ef">
<link rel="icon" type="image/png" href="../mark.png">
<link rel="stylesheet" href="../style.css">
<style>
  .key { font: 600 22px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1px; word-break: break-all; margin: 0 0 16px; }
  .button { display: block; text-align: center; padding: 15px 20px; border-radius: 18px; background: #3550d8; color: #fff; font-weight: 700; text-decoration: none; }
  .button.soft { background: var(--card); color: var(--ink); border: 1px solid var(--hairline); margin-top: 10px; }
</style>
</head>
<body>
<main>
<header><img src="../mark.png" alt=""><a href="../">Selvo</a></header>
<h1>Your access key</h1>
<p class="soft" id="note">Opening Selvo…</p>
<div class="card">
<p class="key" id="key">—</p>
<a class="button" id="open" href="#">Open Selvo</a>
<a class="button soft" id="copy" href="#">Copy the key</a>
<a class="button soft" href="https://apps.apple.com/app/id6814186852">Get Selvo on the App Store</a>
</div>
<p class="soft">If Selvo did not open by itself, copy the key, open Selvo and paste it.</p>
<nav><a href="../">Home</a><a href="../privacy">Privacy</a><a href="../terms">Terms</a><a href="../support">Support</a><a href="../help">Chat</a></nav>
</main>
<script>
  // /key#<code>: the key travels in the fragment, which never reaches a server. The page hands it
  // to the app through its selvo:// link, and keeps it on screen for a paste when the app does not open.
  var code = decodeURIComponent((location.hash || "").slice(1)).trim();
  if (code) {
    var link = "selvo://key/" + encodeURIComponent(code);
    document.getElementById("key").textContent = code;
    document.getElementById("open").href = link;
    location.href = link;
  } else {
    // No key: the bot's "Open Selvo" button, the access already granted. Just bring the app up.
    document.querySelector(".card").hidden = true;
    document.getElementById("open").href = "selvo://open";
    location.href = "selvo://open";
  }
  document.getElementById("copy").addEventListener("click", function (event) {
    event.preventDefault();
    if (!code || !navigator.clipboard) return;
    navigator.clipboard.writeText(code).then(function () { event.target.textContent = "Copied"; });
  });
</script>
</body>
</html>
