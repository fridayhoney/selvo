<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Help · Selvo</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f3ef">
<link rel="icon" type="image/png" href="../mark.png">
<style>
  html, body { margin: 0; height: 100%; background: #f4f3ef; color: #1c1b19; font: 600 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #open { display: flex; height: 100%; align-items: center; justify-content: center; }
  #open a { padding: 14px 22px; border-radius: 18px; background: #3550d8; color: #fff; text-decoration: none; }
</style>
</head>
<body>
<div id="open"><a id="chat" href="https://t.me/SelvoAppBot">Open the chat</a></div>
<script>
  // Support is the bot, no longer the web chat (operator, 28-10). /help?id=<deviceId> comes from the app:
  // start=selvo_<id> links the chat to that device, as the app's own Telegram sign-in does (no signature).
  var id = new URLSearchParams(location.search).get("id") || "";
  var url = "https://t.me/SelvoAppBot" + (/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(id) ? "?start=selvo_" + id : "");
  document.getElementById("chat").href = url;
  location.replace(url);
</script>
</body>
</html>
